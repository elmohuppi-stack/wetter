<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      Google Fonts entfernt am 9. August 2026. Der Aufruf übertrug bei jedem
      Seitenaufruf die IP-Adresse an Google, ohne dass die Datenschutzerklärung
      das erwähnte. Die Schrift kommt jetzt vom Gerät des Nutzers; die
      font-family-Angaben nennen Google Sans als ersten Wunsch und fallen sonst
      auf Arial zurück — dieselbe Kette, die Google selbst benutzt.

      Am 4. September 2026 sind auch die Seitenstile hier verschwunden. Karten
      mit Schlagschatten, Farbverläufe und die lila Kopfzeile passten nicht mehr
      zum nüchternen Google-Zuschnitt; das Design steht jetzt vollständig in
      src/tailwind.css und wird nach frontend/style.css gebaut.

      Leaflet ist mit der Karte zusammen entfallen — Google zeigt an dieser
      Stelle keine, und die beiden Skripte von unpkg.com waren der letzte
      Fremdaufruf, der bei jedem Seitenaufruf mitlief.
    -->
    <link rel="stylesheet" href="/frontend/style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🌤️</text></svg>"
    />
    <title>Wetter</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/frontend/src/main.js"></script>
  </body>
</html>
