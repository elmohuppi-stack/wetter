version: "3.8"

services:
  # Der Service heisst nicht "app". Compose setzt den Service-Namen in jedem
  # Netz als Alias, und das Default-Netz ist hier das geteilte hetzner-network.
  # Dort trugen am 8. August vier Container gleichzeitig den Alias "app" -
  # Docker-DNS lieferte sie im Wechsel, und knoras Frontend proxyte seine
  # API-Calls reihum an fremde Anwendungen. Im geteilten Netz muss der
  # Servicename app-weit eindeutig sein; container_name bleibt wetter-app.
  wetter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wetter-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3031}:8000"
    environment:
      - APP_ENV=production
    volumes:
      - .:/app
    working_dir: /app
    command: php -S 0.0.0.0:8000 -t . index.php

networks:
  default:
    name: hetzner-network
    external: true
